[project]
name = "crawler-mcp"
version = "2.0.0"
description = "Web crawler MCP server (fetch, extract, recursive/best-first crawl, structured + LLM extraction) powered by crawl4ai, for Claude connectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
keywords = ["mcp", "crawler", "scraper", "crawl4ai", "claude", "connector"]
dependencies = [
    "mcp>=1.2.0",
    "crawl4ai>=0.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
crawler-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "fetcher", "extract", "errors"]
